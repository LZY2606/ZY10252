[package]
name = "conservation-desk"
version = "0.1.0"
edition = "2021"
description = "反应守恒审查台 — 元素/电荷/同位素/原子身份的精确有理核查"

[lib]
name = "conservation_desk"
path = "src/lib.rs"

[[bin]]
name = "conservation-desk"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
num-rational = "0.4"
num-traits = "0.2"

[profile.dev]
opt-level = 1
