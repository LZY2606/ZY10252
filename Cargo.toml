[package]
name = "conservation-bench"
version = "0.1.0"
edition = "2021"
description = "反应守恒审查台：元素/电荷/同位素/原子身份守恒审查（Rust + Axum + SQLite）"

[[bin]]
name = "conservation-bench"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
